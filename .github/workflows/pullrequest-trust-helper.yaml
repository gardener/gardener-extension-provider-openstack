name: Pull Request Trust Helper
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize

jobs:
  pullrequest-trusted-helper:
    permissions:
      id-token: write
    uses: gardener/cc-utils/.github/workflows/pullrequest-trust-helper.yaml@v1
    with:
      trusted-teams: 'core,gardener-extension-provider-openstack-maintainers'
