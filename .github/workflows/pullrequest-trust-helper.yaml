on:
  pull_request_target:
    types:
    - opened
    - edited
    - reopened
    - synchronize

jobs:
  pullrequest-trusted-helper:
    permissions:
      id-token: write
    uses: gardener/cc-utils/.github/workflows/pullrequest-trust-helper.yaml@9a9c4f544c072143b4c95b8f32b935332c47389d # v1
    with:
      trusted-teams: 'core,gardener-extension-provider-openstack-maintainers'
