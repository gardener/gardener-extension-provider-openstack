on:
  pull_request_target:
    types:
    - opened
    - edited
    - reopened
    - synchronize

jobs:
  pullrequest-trusted-helper:
    permissions:
      id-token: write
    uses: gardener/cc-utils/.github/workflows/pullrequest-trust-helper.yaml@bce63f62928717a11f610ec8022af9feb497d5df # v1
    with:
      trusted-teams: 'core,gardener-extension-provider-openstack-maintainers'
