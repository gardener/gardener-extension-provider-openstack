name: Auto-update Image Versions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0' # Runs at 6:00 AM UTC every Sunday

jobs:
  update-images:
    uses: gardener/cc-utils/.github/workflows/update-extension-provider-images.yaml@v1
    permissions:
      contents: write
      id-token: write


