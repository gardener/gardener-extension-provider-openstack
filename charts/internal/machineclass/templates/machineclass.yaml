{{- range $index, $machineClass := .Values.machineClasses }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $machineClass.name }}
  namespace: {{ $.Release.Namespace }}
{{- if $machineClass.labels }}
  labels: {{- toYaml $machineClass.labels | nindent 4 }}
{{- end }}
type: Opaque
data:
  userData: {{ $machineClass.secret.cloudConfig | b64enc }}
---
apiVersion: machine.sapcloud.io/v1alpha1
kind: MachineClass
metadata:
  name: {{ $machineClass.name }}
  namespace: {{ $.Release.Namespace }}
{{- if and $machineClass.operatingSystem $machineClass.labels }}
  labels: {{- merge $machineClass.operatingSystem $machineClass.labels | toYaml | nindent 4 }}
{{- else if $machineClass.operatingSystem }}
  labels: {{- toYaml $machineClass.operatingSystem | nindent 4 }}
{{- else if $machineClass.labels }}
  labels: {{- toYaml $machineClass.labels | nindent 4 }}
{{- end }}
provider: "OpenStack"
{{- if $machineClass.nodeTemplate }}
nodeTemplate:
  architecture: {{ $machineClass.nodeTemplate.architecture | quote }}
  capacity: {{- toYaml $machineClass.nodeTemplate.capacity | nindent 4 }}
{{- if $machineClass.nodeTemplate.virtualCapacity }}
  virtualCapacity: {{ toYaml $machineClass.nodeTemplate.virtualCapacity | nindent 4 }}
{{- end }}
  instanceType: {{ $machineClass.nodeTemplate.instanceType | quote }}
  region: {{ $machineClass.nodeTemplate.region | quote }}
  zone: {{ $machineClass.nodeTemplate.zone | quote }}
{{- end }}
secretRef:
  name: {{ $machineClass.name }}
  namespace: {{ $.Release.Namespace }}
credentialsSecretRef:
  name: {{ $machineClass.credentialsSecretRef.name }}
  namespace: {{ $machineClass.credentialsSecretRef.namespace }}
providerSpec:
  apiVersion: openstack.machine.gardener.cloud/v1alpha1
  kind: MachineProviderConfig
  spec:
    region: {{ $machineClass.region | quote }}
    availabilityZone: {{ $machineClass.availabilityZone | quote }}
    flavorName: {{ $machineClass.machineType | quote }}
    keyName: {{ $machineClass.keyName | quote }}
{{- if $machineClass.imageID }}
    imageID: {{ $machineClass.imageID | quote }}
{{- else }}
    imageName: {{ $machineClass.imageName | quote }}
{{- end }}
    networkID: {{ $machineClass.networkID | quote }}
    subnetIDs:
{{ toYaml $machineClass.subnetIDs | indent 6 }}
    podNetworkCIDRs:
{{ toYaml $machineClass.podNetworkCIDRs | indent 6 }}
{{- if $machineClass.rootDiskSize }}
    rootDiskSize: {{ $machineClass.rootDiskSize }}
{{- end }}
{{- if $machineClass.rootDiskType}}
    rootDiskType: {{ $machineClass.rootDiskType | quote }}
{{- end }}
{{- if hasKey $machineClass "rootDiskAvailabilityZone" }}
    rootDiskAvailabilityZone: {{ $machineClass.rootDiskAvailabilityZone | quote }}
{{- end }}
{{- if $machineClass.serverGroupID }}
    serverGroupID: {{ $machineClass.serverGroupID | quote }}
{{- end }}
    securityGroups: {{- toYaml $machineClass.securityGroups | nindent 4 }}
{{- if $machineClass.additionalNetworkInterfaces }}
    additionalNetworkInterfaces:
{{ toYaml $machineClass.additionalNetworkInterfaces | indent 4 }}
{{- end }}
{{- if $machineClass.tags }}
    tags: {{- toYaml $machineClass.tags | nindent 6 }}
{{- end }}
{{- end }}
