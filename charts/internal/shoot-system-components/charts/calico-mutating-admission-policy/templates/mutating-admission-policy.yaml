{{- if .Values.enabled }}
---
apiVersion: admissionregistration.k8s.io/{{ .Values.apiVersion }}
kind: MutatingAdmissionPolicyBinding
metadata:
  name: block-calico-network-unavailable-binding
spec:
  policyName: block-calico-network-unavailable
---
# MutatingAdmissionPolicy to block Calico from setting the NetworkUnavailable condition on nodes.
apiVersion: admissionregistration.k8s.io/{{ .Values.apiVersion }}
kind: MutatingAdmissionPolicy
metadata:
  name: block-calico-network-unavailable
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["nodes/status"]
  matchConditions:
    # Only apply to requests from the calico-node service account
    - name: is-calico-node
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:calico-node"
    # Only apply if calico is trying to set/modify NetworkUnavailable condition
    - name: has-network-unavailable-in-request
      expression: >-
        object.status.conditions.exists(c, c.type == 'NetworkUnavailable')
  variables:
    # Rebuild each condition as a plain CEL map so no lazily-wrapped native
    # NodeCondition struct ends up in the JSONPatch value. On K8s >= 1.37 the
    # reflection-based CEL conversion (kubernetes/kubernetes#138771) keeps
    # oldObject conditions as native structs that cannot be marshalled when
    # placed into a JSONPatch value, which previously failed the policy.
    #
    # A CEL map literal infers a single homogeneous value type from its first
    # entry. Because 'type' is a string literal, CEL types the whole map as
    # map<string, string>. On K8s >= 1.37 the type-checker tolerates dyn values
    # mixed in; on K8s 1.36 it strictly rejects them, so c.status (dyn from the
    # schema) failed with "expected type 'string' but found 'dyn'". Wrapping the
    # scalar fields in string() keeps the map homogeneously typed on both.
    #
    # Timestamps must stay CEL timestamp values (not string()) so they serialize
    # to RFC3339 and match metav1.Time. Their absent-field fallback must be null,
    # NOT '' — metav1.Time.UnmarshalJSON('') errors, while null decodes to the
    # zero time. A string()?:null ternary does not type-check (no bool/string/null
    # overload), so both branches are wrapped in dyn() to unify to dyn and keep
    # the null fallback.
    # Extract the current NetworkUnavailable condition from the old object.
    - name: oldNetworkUnavailableCondition
      expression: >-
        has(oldObject.status) && has(oldObject.status.conditions) ?
        oldObject.status.conditions.filter(c, c.type == 'NetworkUnavailable').map(c, {
          'type':               'NetworkUnavailable',
          'status':             string(c.status),
          'reason':             has(c.reason)  ? string(c.reason)  : '',
          'message':            has(c.message) ? string(c.message) : '',
          'lastTransitionTime': has(c.lastTransitionTime) ? dyn(c.lastTransitionTime) : dyn(null),
          'lastHeartbeatTime':  has(c.lastHeartbeatTime)  ? dyn(c.lastHeartbeatTime)  : dyn(null)
        }) : []
    # Remove NetworkUnavailable from the new conditions and rebuild each kept
    # condition as a plain CEL map for the same marshalling reason.
    - name: conditionsWithoutNetworkUnavailable
      expression: >-
        object.status.conditions.filter(c, c.type != 'NetworkUnavailable').map(c, {
          'type':               string(c.type),
          'status':             string(c.status),
          'reason':             has(c.reason)  ? string(c.reason)  : '',
          'message':            has(c.message) ? string(c.message) : '',
          'lastTransitionTime': has(c.lastTransitionTime) ? dyn(c.lastTransitionTime) : dyn(null),
          'lastHeartbeatTime':  has(c.lastHeartbeatTime)  ? dyn(c.lastHeartbeatTime)  : dyn(null)
        })
    # Reconstruct final conditions
    - name: finalConditions
      expression: >-
        variables.oldNetworkUnavailableCondition.size() > 0 ?
        variables.conditionsWithoutNetworkUnavailable + variables.oldNetworkUnavailableCondition :
        variables.conditionsWithoutNetworkUnavailable
  mutations:
    # Replace the entire conditions array with the reconstructed version
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          [
            JSONPatch{
              op: "replace",
              path: "/status/conditions",
              value: variables.finalConditions
            }
          ]
{{- end }}
